[hunspell]
lang = "en_US"
search_dirs = ["."]
extra_dictionaries = ["signer.dic"]
skip_os_lookups = true
use_builtin = true

[hunspell.quirks]
# He tagged it as 'TheGreatestOfAllTimes'
transform_regex = [
    # `Type`'s
    "^'([^\\s])'$",
    # 5x
    # 10.7%
    "^[0-9_]+(?:\\.[0-9]*)?(x|%)$",
    # Transforms' and possessives Zigner's
    "^(.*)'s?$",
    # backslashes
    "^\\+$",
    "^[0-9]*+k|MB|Mb|ms|Mbit|nd|th|rd$",
    # single chars and punctuation fragments
    "^[=></%{}\\[\\]]+$",
    # 22_100
    "^(?:[0-9]+_)+[0-9]+$",
    # hex values 0x12, 0x53 etc (with optional brackets/punctuation)
    "^[\\[\\(]?0x[0-9a-fA-F]+[\\]\\)\\[]?$",
    # BIP derivation path segments and fragments
    "^m/[0-9/']+$",
    "^[a-z_]*[0-9]*'/.*$",
    "^[a-z_]*[0-9]*'$",
    "^[0-9]+'/?$",
    # arrow character
    "^→$",
    # units and operators
    "^sat/[a-zA-Z]+$",
    "^\\|\\|$",
    # version strings v0, v1, v2 etc
    "^v[0-9]+$",
    # URLs
    "^https?://.*$",
    # unicode symbols and tilde
    "^[✓~→←↑↓α⇒−≤±\\\\]$",
    # section refs (§3), byte-literal fragments (b'A), arrow pairs
    "^§[0-9]+$",
    "^b'[A-Za-z0-9]$",
    "^[A-Za-z]+→[a-z]+$",
    # approximate durations/sizes like ~60s
    "^~[0-9]+[a-zA-Z]*$",
    # numeric ranges (en-dash or hyphen) and powers
    "^[0-9]+[–-][0-9]+$",
    "^[0-9]+\\^[0-9]+$",
    # en-dash compounds (Reed–Solomon)
    "^[A-Za-z]+–[A-Za-z]+$",
    # interpolation placeholders {origin}, \n{domain}
    "^\\\\?n?\\{[a-z_]+\\}$",
    # identifiers with underscores: payload_len, OP_RETURN, RELEASE_KEY_BYTES
    "^[A-Za-z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)+$",
    # short and full git commit hashes (bd9c63e)
    "^[0-9a-f]{7,40}$",
    # pixel sizes (512px) and integer types (u16, i64)
    "^[0-9]+px$",
    "^[ui][0-9]+$"
]

allow_concatenation = true
allow_dashes = true
