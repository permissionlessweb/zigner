name: 'Install Android Dependencies'
description: 'Sets up JDK and Android SDK/NDK'

runs:
  using: "composite"
  steps:
    - name: Set up JDK environment
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'adopt'
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        cmdline-tools-version: 12266719
        # The action's default is "tools platform-tools". Google removed the
        # legacy `tools` package from the SDK repository (CI red from
        # 2026-09-27: sdkmanager "Failed to find package 'tools'"). Nothing
        # here needs it: NDK, build-tools and platform are installed below.
        packages: platform-tools

    - name: Install NDK
      shell: bash
      run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager --install "ndk;28.2.13676358" --sdk_root=${ANDROID_SDK_ROOT}

    - name: Install build-tools
      shell: bash
      run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager --install "build-tools;36.0.0" "platforms;android-36" --sdk_root=${ANDROID_SDK_ROOT}
