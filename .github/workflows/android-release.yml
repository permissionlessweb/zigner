name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  # module0.wasm is the PCZT signer the device loads to authorize spends, and
  # it ships as a committed binary. rust-test-ironwood.yml verifies it against
  # its source, but that workflow triggers on pull_request and pushes to
  # master - a tag matches neither, so without this job a release could ship a
  # blob unrelated to the published source with every other check green.
  #
  # Verifying master and not verifying artifacts would be the wrong way round:
  # the artifact is the thing anyone can actually check us on.
  verify-module:
    name: Verify baked wasm module matches source
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No Rust toolchain setup: the build happens inside the pinned
      # container, which is the entire point - a runner-local toolchain would
      # produce a binary nobody else can reproduce.
      - name: Rebuild module in pinned container and compare against asset
        run: ./scripts/verify-baked-module.sh --require-docker

  run-tests:
    name: Run tests
    uses: ./.github/workflows/reusable-android-tests.yml

  build-apk:
    name: Build APKs
    uses: ./.github/workflows/reusable-android-build.yml
    with:
      is-release: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # verify-module gates publication: nothing reaches a GitHub release
    # unless the shipped wasm provably came from the tagged source.
    needs: [verify-module, run-tests, build-apk]
    steps:
      - name: Checkout Sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup build-tool version variable
        shell: bash
        run: |
          echo "BUILD_TOOL_VERSION=${{ needs.build-apk.outputs.build-tool-version }}" >> $GITHUB_ENV

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zigner-apk
          path: app

      # Signed here with the SDK's own apksigner: the release key never
      # passes through a third-party action.
      - name: Sign app APK
        id: sign_app
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOL_VERSION"
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 -d > "$ks"
          unsigned=$(ls app/*.apk)
          [ "$(echo "$unsigned" | wc -l)" -eq 1 ] || { echo "expected one APK, got: $unsigned"; exit 1; }
          "$bt/zipalign" -f -p 4 "$unsigned" app/aligned.apk
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled true \
            --out app/signed.apk app/aligned.apk
          "$bt/apksigner" verify --print-certs app/signed.apk
          echo "signedReleaseFile=app/signed.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv "${{ steps.sign_app.outputs.signedReleaseFile }}" "app/zigner-${{ github.ref_name }}.apk"

      - name: Compute checksums
        run: |
          cd app
          sha256sum "zigner-${{ github.ref_name }}.apk" > SHA256SUMS

      - name: Sign checksums
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/signing_key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$SSH_SIGNING_KEY" > "$key")
          ssh-keygen -Y sign -f "$key" -n file app/SHA256SUMS

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
            git log --pretty=format:"- %s (%h)" "${{ steps.prev_tag.outputs.tag }}".."${{ github.ref_name }}" > release-notes.md
          else
            git log --pretty=format:"- %s (%h)" > release-notes.md
          fi

      - name: Determine pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -q '-'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zafu Zigner ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            app/zigner-${{ github.ref_name }}.apk
            app/SHA256SUMS
            app/SHA256SUMS.sig
