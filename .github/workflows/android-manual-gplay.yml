name: Manual Android Google play distribution

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  run-tests:
    name: Run tests
    uses: ./.github/workflows/reusable-android-tests.yml 
  build-apk:
    name: Build APKs
    uses: ./.github/workflows/reusable-android-build.yml
    with:
      is-release: true
  upload-apk:
    runs-on: ubuntu-latest
    needs: [run-tests, build-apk]
    steps:
      - name: Setup build-tool version variable
        shell: bash
        run: |
          echo "BUILD_TOOL_VERSION=${{ needs.build-apk.outputs.build-tool-version }}" >> $GITHUB_ENV

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zigner-aab
          path: app

      # An AAB is signed with jarsigner (apksigner does not sign bundles),
      # here rather than in a third-party action.
      - name: Sign app bundle
        id: sign_app
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_PLAY_STORE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_PLAY_STORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAY_STORE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 -d > "$ks"
          bundle=$(ls app/*.aab)
          [ "$(echo "$bundle" | wc -l)" -eq 1 ] || { echo "expected one AAB, got: $bundle"; exit 1; }
          jarsigner -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -signedjar app/signed.aab "$bundle" "$KEY_ALIAS"
          jarsigner -verify app/signed.aab
          echo "signedReleaseFile=app/signed.aab" >> "$GITHUB_OUTPUT"

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_STORE_API_JSON }}
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          packageName: net.rotko.zigner
          track: internal

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}  
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [upload-apk]

    steps:
      - name: Checkout Sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
      - name: Download signed APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apk
          path: release-assets

      - name: Extract version from build.gradle
        id: version
        run: |
          VERSION=$(grep -oP '(?<=versionName ")[^"]+' android/build.gradle | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      # Get last published tag (the latest reachable tag in the repo)
      - name: Get last tag
        id: last_tag
        run: |
          git fetch --tags --force
          echo "tag=$(git describe --tags --abbrev=0 $(git rev-list --tags --max-count=1))" >> $GITHUB_OUTPUT

      # Build changelog from git log between last tag and HEAD
      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${{ steps.last_tag.outputs.tag }}..HEAD)
          echo "${CHANGELOG}" > release-notes.md
          echo "${CHANGELOG}"

      # Create GitHub Release using the generated changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Zafu Zigner ${{ steps.version.outputs.version }} android
          body_path: release-notes.md
          files: release-assets/*.apk
          draft: true
