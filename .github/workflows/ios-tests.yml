name: Test iOS app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only when something the iOS app builds changed. macOS arm64 runners are the
# scarcest GitHub has: a run that cannot get one fails after ~15 minutes with
# "The job was not acquired by Runner", which read as a red iOS check on
# Android-only and docs-only changes. The Rust core is included because the
# app links it through the FFI.
on:
  pull_request:
    paths:
      - "ios/**"
      - "rust/**"
      - ".github/workflows/ios-tests.yml"
      - ".github/actions/install-ios-dep/**"
  push:
    branches:
      - master
    paths:
      - "ios/**"
      - "rust/**"
      - ".github/workflows/ios-tests.yml"
      - ".github/actions/install-ios-dep/**"

jobs:
  run-tests:
    name: Run tests
    runs-on: macos-15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install iOS Dependencies
        uses: ./.github/actions/install-ios-dep

      - name: Run unit tests
        shell: bash
        run: |
          cd ios
          bundle exec fastlane run_unit_tests
