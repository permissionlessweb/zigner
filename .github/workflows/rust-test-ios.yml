name: Rust backend test for ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    name: Cargo test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          brew install opencv

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.99.1

      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@1cd874a5478fdca35d868ccc74640c5aabbb8f1b # v3.0.0
        with:
          crate: cargo-nextest
          version: 0.9

      - name: Install uniffi_bindgen
        uses: actions-rs/install@9da1d2adcfe5e7c16992e8242ca33a56b6d9b101 # v0.1
        with:
          crate: uniffi_bindgen
          version: 0.22.0 # Must be in sync with version in Cargo.toml
          use-tool-cache: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@27b8ea9368cf428f0bfe41b0876b1a7e809d9844 # v2.7.7
        with:
          workspaces: rust -> rust/target

      - name: cargo nextest
        shell: bash
        run: |
          cd rust
          export DYLD_FALLBACK_LIBRARY_PATH="$(xcode-select --print-path)/Toolchains/XcodeDefault.xctoolchain/usr/lib/"
          # module_host runtime tests need the pczt_signing wasm artifact;
          # apple clang can't compile secp256k1-sys for wasm32, so those
          # tests run on the Linux job only
          cargo nextest run --retries 2 --locked --workspace --exclude qr_reader_pc -E 'not (package(module_host) and binary(runtime))'
