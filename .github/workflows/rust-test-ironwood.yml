name: Rust NU6.3 ironwood signer

# Guards the ironwood (NU6.3 / V6) signing path in rust/pczt_signing.
#
# Ironwood used to require a fork of librustzcash plus
# RUSTFLAGS='--cfg zcash_unstable="nu6.3"', built through the parallel
# rust/pczt_signing_valar manifest. Released `pczt` 0.9.2 ships Ironwood
# UNGATED, so there is no cfg and no fork any more: the default build compiles
# the ironwood code and the ironwood tests run in the default suite.
#
# This job still exists because the wasmi round-trip test needs the module wasm
# built FIRST (it skips loudly otherwise), and that is the artifact the Android
# device actually loads as assets/modules/module0.wasm.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ironwood:
    name: Cargo test + wasm build (ironwood)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned, not `stable`. The module verification below compares bytes
      # against the committed asset, and rustc codegen changes between
      # releases - on a floating toolchain a routine rustc bump would fail
      # the check with nothing in this repo having changed.
      #
      # The version is passed as an input rather than left to
      # rust/pczt_signing/rust-toolchain.toml because this action sets the
      # job's active toolchain itself; the file governs local builds. Keep
      # the two in sync.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@27b8ea9368cf428f0bfe41b0876b1a7e809d9844 # v2.7.7
        with:
          workspaces: rust/pczt_signing -> rust/pczt_signing/target

      # the E2E wasmi test loads the wasm artifact, so build it first
      - name: cargo build (wasm32-unknown-unknown, release)
        run: |
          cd rust/pczt_signing
          cargo build --target wasm32-unknown-unknown --release --locked

      # Checks that the bytes committed as assets/modules/module0.wasm really
      # are a build of this source - otherwise the source in this tree and the
      # binary on the phone are unrelated, and review of the former says
      # nothing about the latter.
      #
      # This builds again inside the pinned container rather than reusing the
      # artifact from the step above: a runner-local cargo build bakes in the
      # runner's toolchain and registry paths, so it is not byte-comparable
      # with anything built anywhere else.
      - name: verify module0.wasm matches this source
        run: ./scripts/verify-baked-module.sh --require-docker

      - name: cargo test (native, V5 + V6/ironwood E2E)
        run: |
          cd rust/pczt_signing
          cargo test --release --locked
