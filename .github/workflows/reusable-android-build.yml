name: Reusable workflow for building Android app

on:
  workflow_call:
    inputs:
      is-release:
        required: true
        type: boolean
        default: false
    outputs:
      build-tool-version:
        description: "build-tool version"
        value: ${{ jobs.build-apk.outputs.build-tool-version }}

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository }}/opencv-builder:4.11.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    outputs:
      build-tool-version: ${{ steps.read-build-tool-version.outputs.build-tool-version }}
    steps:
      - name: Checkout Sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Install Android Dependencies
        uses: ./.github/actions/install-android-dep

      - name: Read build-tool version
        id: read-build-tool-version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -n1)
          echo "Build tool version is: ${BUILD_TOOL_VERSION}"
          echo "build-tool-version=${BUILD_TOOL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.99.1

      - name: Install uniffi_bindgen
        uses: actions-rs/install@9da1d2adcfe5e7c16992e8242ca33a56b6d9b101 # v0.1
        with:
          crate: uniffi_bindgen
          version: 0.22.0 # Must be in sync with version in Cargo.toml
          use-tool-cache: true

      - name: Install additional rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@27b8ea9368cf428f0bfe41b0876b1a7e809d9844 # v2.7.7
        with:
          workspaces: rust -> rust/target

      - name: Gradle Cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble debug apk
        if: ${{ inputs.is-release == false }}
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: List debug APKs
        if: ${{ inputs.is-release == false }}
        run: |
          ls android/build/outputs/apk/debug

      - name: Upload debug APKs
        if: ${{ inputs.is-release == false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zigner-apk
          path: android/build/outputs/apk/debug/*.apk

      - name: Assemble release apk + bundle
        if: ${{ inputs.is-release == true }}
        run: |
          ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: List release artifacts
        if: ${{ inputs.is-release == true }}
        run: |
          ls android/build/outputs/apk/release android/build/outputs/bundle/release

      - name: Upload release APKs
        if: ${{ inputs.is-release == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zigner-apk
          path: android/build/outputs/apk/release/*.apk

      # Google Play requires the Android App Bundle for new apps
      - name: Upload release AAB
        if: ${{ inputs.is-release == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zigner-aab
          path: android/build/outputs/bundle/release/*.aab
