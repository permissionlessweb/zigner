plugins {
	id 'com.android.application'
	id 'kotlin-android'
	id 'org.mozilla.rust-android-gradle.rust-android'
	id 'idea'
}

apply plugin: 'kotlin-android'

// Derive versionCode from versionName: "1.2.3" -> 1_002_003
static int computeVersionCode(String name) {
	def parts = name.tokenize('.-')
	def major = parts[0] as int
	def minor = parts[1] as int
	def patch = parts[2] as int
	return major * 1_000_000 + minor * 1_000 + patch
}

def appVersionName = "0.14.0"

android {
	defaultConfig {
		applicationId "net.rotko.zigner"
		minSdk 23
		targetSdk 35
		versionCode computeVersionCode(appVersionName)
		versionName appVersionName
		ndk {
			abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
		}

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		vectorDrawables {
			useSupportLibrary true
		}
	}

	// Play upload signing. Reads android/keystore.properties (gitignored):
	//   storeFile=zigner-upload.jks
	//   storePassword=...
	//   keyAlias=upload
	//   keyPassword=...
	// Falls back to env vars (CI). Unsigned builds still work for debug.
	def keystoreProps = new Properties()
	def keystorePropsFile = file('keystore.properties')
	if (keystorePropsFile.exists()) {
		keystorePropsFile.withInputStream { keystoreProps.load(it) }
	}
	// All-or-nothing signing resolution: partially configured signing is a
	// configuration error (named, fail-fast), not a cryptic packaging failure.
	def signingInputs = [
		storeFile:     keystoreProps['storeFile']     ?: System.getenv('ZIGNER_UPLOAD_KEYSTORE'),
		storePassword: keystoreProps['storePassword'] ?: System.getenv('ZIGNER_UPLOAD_STORE_PASSWORD'),
		keyAlias:      keystoreProps['keyAlias']      ?: System.getenv('ZIGNER_UPLOAD_KEY_ALIAS'),
		keyPassword:   keystoreProps['keyPassword']   ?: System.getenv('ZIGNER_UPLOAD_KEY_PASSWORD'),
	]
	def signingConfigured = signingInputs.values().any { it }
	if (signingConfigured) {
		def missing = signingInputs.findAll { !it.value }.keySet()
		if (!missing.isEmpty()) {
			throw new GradleException(
				"release signing partially configured - missing: ${missing.join(', ')} " +
				"(android/keystore.properties or ZIGNER_UPLOAD_* env)")
		}
		// file() resolves relative paths against android/, not the repo root
		def resolvedStore = file(signingInputs.storeFile)
		if (!resolvedStore.exists()) {
			throw new GradleException(
				"release keystore not found: ${resolvedStore} " +
				"(relative paths resolve against android/ - use an absolute path or android/-relative)")
		}
	}
	signingConfigs {
		release {
			if (signingConfigured) {
				storeFile file(signingInputs.storeFile)
				storePassword signingInputs.storePassword
				keyAlias signingInputs.keyAlias
				keyPassword signingInputs.keyPassword
			}
		}
	}
	buildTypes {
		debug {
			// Debug and release shared the application id, so they could not
			// coexist and an install of one silently replaced the other. That
			// is how a phone ends up running a DEBUGGABLE build of a signer -
			// debuggable means any app with adb access can attach to the
			// process holding the seed.
			applicationIdSuffix ".debug"
			versionNameSuffix "-debug"
		}
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			// Store artifacts ship phone ABIs only. x86_64 remains in debug
			// builds for emulators; dropping it here keeps the APK set under
			// Accrescent's 128 MiB cap (was 130.2 MiB with all four ABIs).
			ndk {
				abiFilters 'armeabi-v7a', 'arm64-v8a'
			}
			if (signingConfigured) {
				signingConfig signingConfigs.release
			}
		}
	}

	// CI guard against silently-green unsigned releases: with
	// ZIGNER_REQUIRE_SIGNED=1, any release build without signing fails fast
	// instead of emitting an unpublishable artifact.
	tasks.configureEach { t ->
		if ((t.name == 'assembleRelease' || t.name == 'bundleRelease' || t.name == 'packageRelease')
			&& System.getenv('ZIGNER_REQUIRE_SIGNED') == '1' && !signingConfigured) {
			t.doFirst {
				throw new GradleException(
					'ZIGNER_REQUIRE_SIGNED=1 but release signing is not configured - refusing unsigned release')
			}
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	kotlinOptions {
		jvmTarget = '11'
	}
	buildFeatures {
		compose true
	}
	composeOptions {
		kotlinCompilerExtensionVersion compose_compiler_version
	}
	packagingOptions {
		resources {
			excludes += '/META-INF/{AL2.0,LGPL2.1}'
		}
		jniLibs {
			pickFirsts += ['lib/armeabi-v7a/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so']
		}
	}
	compileSdk 36
	ndkVersion '28.2.13676358'
    namespace 'net.rotko.zigner'
}

android.applicationVariants.all { variant ->
	def uniffiPath = "${buildDir}/generated/source/uniffi/${variant.name}/java"
	def t = tasks.register("generate${variant.name.capitalize()}UniFFIBindings", Exec) {
		workingDir "${project.projectDir}"
		// Runs the bindings generation, note that you must have uniffi-bindgen installed and in your PATH environment variable
		commandLine 'uniffi-bindgen', 'generate', "${workingDir}/../rust/signer/src/signer.udl", '--language', 'kotlin', '--out-dir', uniffiPath
	}
	variant.javaCompileProvider.get().dependsOn(t)
	// Kotlin compilation runs before javaCompile and reads the generated
	// bindings as a source dir - without this dependency a bare
	// :android:compileDebugKotlin (or a clean tree / stale bindings after a
	// udl change) compiles against missing or outdated bindings.
	tasks.matching { it.name == "compile${variant.name.capitalize()}Kotlin" }.configureEach {
		it.dependsOn(t)
	}
	// Air-gap guard: fail the build if the MERGED manifest can reach the
	// network. Zigner requests no network access itself, but dependencies can
	// add it (ML Kit pulls INTERNET + Google datatransport upload components;
	// AndroidManifest.xml strips them with tools:node="remove", issue #25).
	// This check is what stops a dependency bump from silently re-adding them.
	tasks.matching { it.name == "process${variant.name.capitalize()}MainManifest" }.configureEach { task ->
		task.doLast {
			def forbidden = [
				'"android.permission.INTERNET"',
				'"android.permission.ACCESS_NETWORK_STATE"',
				'"com.google.android.datatransport',
				'"com.google.android.gms.common.api.GoogleApiActivity"',
			]
			task.outputs.files.asFileTree.matching { include '**/AndroidManifest.xml' }.each { f ->
				def hits = forbidden.findAll { f.text.contains(it) }
				if (!hits.isEmpty()) {
					throw new GradleException(
						"Merged manifest ${f} grants network access or telemetry: ${hits}. " +
						"A cold signer must not reach the network - strip it in " +
						"src/main/AndroidManifest.xml with tools:node=\"remove\" (see issue #25).")
				}
			}
		}
	}
	def sourceSet = variant.sourceSets.find { it.name == variant.name }
	sourceSet.java.srcDir new File(uniffiPath)
	// XXX: I've been trying to make this work but I can't, so the compiled bindings will show as "regular sources" in Android Studio.
	idea.module.generatedSourceDirs += file("${uniffiPath}/uniffi")
}
apply plugin: 'org.mozilla.rust-android-gradle.rust-android'

cargo {
	module = "../rust/signer"
	targetDirectory = "../rust/target"
	libname = "signer"
	// Phone ABIs only by default - x86_64 exists solely for emulator work
	// and its ~30 MiB of split APKs pushed the store APK set past
	// Accrescent's 128 MiB cap. Opt back in with -PwithEmulatorAbi.
	targets = project.hasProperty('withEmulatorAbi')
		? ["arm", "arm64", "x86_64"]
		: ["arm", "arm64"]
	apiLevel = 24 //NDK API level, not SDK
	profile = 'release'
	extraCargoBuildArguments = ["--locked"]
}

tasks.matching { it.name.matches(/merge.*JniLibFolders/) }.configureEach {
	it.inputs.dir(new File(buildDir, "rustJniLibs/android"))
	it.dependsOn("cargoBuild")
}

task buildDB (type: Exec) {
	commandLine './generate_database.sh'
}

dependencies {
	implementation "androidx.core:core-ktx:1.12.0"
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'com.google.android.material:material:1.9.0'
	implementation 'androidx.activity:activity-compose:1.8.2'
	implementation 'androidx.biometric:biometric:1.1.0'
	implementation "androidx.compose.ui:ui:$compose_libs_version"
	implementation "androidx.compose.material:material:$compose_libs_version"
	implementation "androidx.compose.material:material-icons-extended:$compose_libs_version"
	implementation "androidx.compose.ui:ui-tooling-preview:$compose_libs_version"
	implementation "com.google.accompanist:accompanist-permissions:$accompanist_version"
	implementation "androidx.datastore:datastore-preferences:1.0.0"
	implementation "androidx.navigation:navigation-compose:2.7.7"
	implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
	implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
	implementation 'androidx.security:security-crypto:1.1.0-alpha06'
	implementation 'androidx.security:security-crypto-ktx:1.1.0-alpha06'
	implementation "androidx.camera:camera-core:$androidx_camera_version"
	implementation "androidx.camera:camera-lifecycle:$androidx_camera_version"
	implementation "androidx.camera:camera-view:$androidx_camera_version"
	implementation "androidx.camera:camera-camera2:$androidx_camera_version"
	implementation "com.google.mlkit:barcode-scanning:17.3.0"
	implementation "com.halilibo.compose-richtext:richtext-commonmark-android:0.20.0"
	implementation "com.halilibo.compose-richtext:richtext-ui-material-android:0.20.0"
	implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7"
	implementation "net.java.dev.jna:jna:5.15.0@aar"
	implementation "com.appmattus.crypto:cryptohash:0.10.1" //black2b hash for dot icon
	implementation "io.coil-kt:coil-compose:$coilVersion"
	implementation "io.coil-kt:coil-svg:$coilVersion"
	implementation 'com.jakewharton.timber:timber:5.0.1'
	testImplementation 'junit:junit:4.13.2'
	// Real org.json for JVM unit tests (the android.jar copy is a throwing stub).
	testImplementation 'org.json:json:20240303'
	testImplementation "org.mockito:mockito-core:5.10.0"
	testImplementation "androidx.test:core:1.5.0"
	testImplementation "androidx.test.ext:junit:1.1.5"
	testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
	androidTestImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test.ext:junit:1.1.5'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
	androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_libs_version"
	debugImplementation "androidx.compose.ui:ui-tooling:$compose_libs_version"
}

preBuild.dependsOn "cargoBuild","buildDB"
