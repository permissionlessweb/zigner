[package]
name = "db_handling"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.82"
constants = {path = "../constants"}
defaults = {path = "../defaults", default-features = false, optional = true}
definitions = {path = "../definitions", default-features = false}
qrcode_rtx = {path = "../qrcode_rtx", default-features = false}
hex = {version = "0.4.3"}
lazy_static = "1.4.0"
parity-scale-codec = {version = "3.6.9", features = ["derive"]}
regex = "1.10.3"
sled = "0.34.6"
sp-core = {git = "https://github.com/paritytech/substrate", rev = "49734dd1d72a00b9d3b87ba397661a63e0e17af3", default-features = false, features = ["full_crypto"], optional = true}
sp-runtime = {git = "https://github.com/paritytech/substrate", rev = "49734dd1d72a00b9d3b87ba397661a63e0e17af3", default-features = false, optional = true}
thiserror = "1.0.57"
serde_json = "1.0"
time = {version = "0.3.36", features = ["formatting", "macros"]}
tiny-bip39 = {version = "1.0.0", default-features = false, optional = true}
zeroize = { version = "1.7.0", optional = true, features = ["std"] }

# Penumbra cryptography
bech32 = { version = "0.11.0", default-features = false, features = ["alloc"], optional = true }
blake2b_simd = { version = "1.0.2", default-features = false, optional = true }
penumbra-keys = { git = "https://github.com/penumbra-zone/penumbra.git", tag = "v2.0.4", package = "penumbra-sdk-keys", optional = true }

# Ledger Ed25519 (Cardano-style BIP32-Ed25519)
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

# Cosmos SDK chains (BIP44 secp256k1)
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"], optional = true }
ripemd = { version = "0.1", optional = true }

# Bitcoin (BIP-32/44/84/86)
secp256k1 = { version = "0.29", default-features = false, features = ["global-context", "std"], optional = true }

# Nostr (reuses secp256k1 from above for Schnorr)
serde = { version = "1.0", features = ["derive"], optional = true }

# Zcash (ZIP-32 Orchard)
orchard = { version = "0.10", optional = true }
zcash_address = { version = "0.4", optional = true }
zip32 = { version = "0.1", optional = true }

[dev-dependencies]
pretty_assertions = { version = "1.4" }
tempfile = { version = "3.10" }

[features]
default = []
active = ["defaults/active", "definitions/active", "tiny-bip39", "sp-core", "sp-runtime", "zeroize", "penumbra", "ledger", "cosmos", "zcash"]
test = []
penumbra = ["blake2b_simd", "tiny-bip39", "zeroize", "penumbra-keys"]
ledger = ["hmac", "sha2", "tiny-bip39", "zeroize", "sp-core", "sp-runtime"]
cosmos = ["bip32", "bech32", "sha2", "ripemd", "tiny-bip39", "zeroize", "sp-core", "sp-runtime"]
zcash = ["bip32/bip39", "tiny-bip39", "zeroize", "orchard", "zcash_address", "zip32", "serde"]

[lib]
name = "db_handling"
crate-type = ["lib"]
