[package]
name = "transaction_signing"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = "0.4.3"
parity-scale-codec = "3.6.9"
zeroize = { version = "1.7.0", features = ["std", "derive"] }

definitions = { path = "../definitions", default-features = false, features = ["active"] }
db_handling = { path = "../db_handling", default-features = false, features = ["active"] }
sp-core = { git = "https://github.com/paritytech/substrate", rev = "49734dd1d72a00b9d3b87ba397661a63e0e17af3", default-features = false, features = ["full_crypto"] }
sp-runtime = { git = "https://github.com/paritytech/substrate", rev = "49734dd1d72a00b9d3b87ba397661a63e0e17af3", default-features = false }
thiserror = "1.0.57"
anyhow = "1.0.82"
sled = "0.34"

# penumbra crypto dependencies
decaf377 = { version = "0.10.1", optional = true }
decaf377-rdsa = { version = "0.11", optional = true }
blake2b_simd = { version = "1.0.2", optional = true }
rand_chacha = { version = "0.3.1", optional = true }
bip32 = { version = "0.5", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }
poseidon377 = { version = "1.1.0", optional = true }
bech32 = { version = "0.11.0", optional = true }
subtle = { version = "2.5", optional = true }

# penumbra SDK for effect hash verification (optional, adds ~large dep tree)
penumbra-transaction = { git = "https://github.com/penumbra-zone/penumbra.git", tag = "v2.0.4", package = "penumbra-sdk-transaction", default-features = false, optional = true }
penumbra-keys = { git = "https://github.com/penumbra-zone/penumbra.git", tag = "v2.0.4", package = "penumbra-sdk-keys", optional = true }
penumbra-proto = { git = "https://github.com/penumbra-zone/penumbra.git", tag = "v2.0.4", package = "penumbra-sdk-proto", default-features = false, optional = true }

# cosmos signing (reuses secp256k1 + sha2 from zcash)
serde_json = { version = "1", optional = true }

# zcash crypto dependencies
orchard = { package = "zakura-orchard", version = "=2.2.0", default-features = false, optional = true }
secp256k1 = { version = "0.29", optional = true }
ripemd = { version = "0.1", optional = true }
bs58 = { version = "0.5", features = ["check"], optional = true }
pasta_curves = { package = "zakura-pasta-curves", version = "=2.2.0", optional = true }
# OS entropy for RedPallas signing, typed in the rand_core 0.10 the zakura
# orchard signing API takes
rand = { version = "0.10", default-features = false, features = ["sys_rng"], optional = true }
zip32 = { version = "0.2", optional = true }
zcash_address = { package = "zakura-address", version = "=2.2.0", default-features = false, optional = true }
zcash_protocol = { package = "zakura-protocol", version = "=2.2.0", default-features = false, optional = true }
frost-spend = { workspace = true, optional = true }

[features]
default = []
penumbra = ["decaf377", "decaf377-rdsa", "blake2b_simd", "rand_chacha", "bip32", "hmac", "sha2", "pbkdf2", "poseidon377", "bech32", "subtle", "penumbra-transaction", "penumbra-keys", "penumbra-proto"]
zcash = ["orchard", "secp256k1", "ripemd", "bs58", "pasta_curves", "rand", "bip32", "bech32", "sha2", "zip32", "zcash_address", "zcash_protocol", "frost-spend"]
cosmos = ["secp256k1", "sha2", "serde_json"]


[dev-dependencies]
pretty_assertions = "1"
sled = "0.34.6"
constants = { path = "../constants" }
db_handling = {path = "../db_handling", default-features = false, features = ["active"]}
transaction_parsing = { path = "../transaction_parsing", default-features = false }
tempfile = "3.10"

[lib]
name = "transaction_signing"
crate-type = ["lib"]
