[package]
name = "modpack"
version = "0.1.0"
edition = "2021"
description = "zigner release tooling: build, sign and assemble protocol-module packages"
license = "GPL-3.0-only"

[[bin]]
name = "modpack"
path = "src/main.rs"

[dependencies]
module_host = { path = "../module_host" }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# keygen only: OS CSPRNG for the release keypairs. Producer-side, air-gapped.
getrandom = "0.2"
bsdiff = "0.2"
# Producer side only. This never ships to a device, so the C dependency is
# free here - unlike in module_host, where it would have to cross-compile.
zstd = "0.14"

[dev-dependencies]
ed25519-dalek = "2"
