[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

ignore = [
    "RUSTSEC-2024-0344",
    "RUSTSEC-2021-0139",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2022-0061",
    "RUSTSEC-2022-0081",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0388",
    "RUSTSEC-2022-0080",
    # atomic-polyfill unmaintained - transitive via uniffi_bindgen 0.22,
    # goes away with the uniffi upgrade
    "RUSTSEC-2023-0089",
    # unmaintained transitive deps pinned by the substrate-era stack
    "RUSTSEC-2025-0141", # bincode
    "RUSTSEC-2026-0105", # core2
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0161", # libsecp256k1
    "RUSTSEC-2025-0119", # number_prefix
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0173", # proc-macro-error2
    "RUSTSEC-2025-0134", # rustls-pemfile
    # rand 0.8 unsound with custom logger; fix is the breaking 0.9 bump
    "RUSTSEC-2026-0097",
    # tracing-subscriber 0.2 ANSI log poisoning; 0.3 bump blocked by substrate pins
    "RUSTSEC-2025-0055",
    # rustls-webpki 0.101 name-constraint/CRL advisories; fixes only in 0.102+
    # which the pinned rustls 0.21 stack cannot take
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rsa Marvin timing attack - no patched release exists. Linked via age's
    # ssh support. The attack needs an RSA *decryption* timing oracle; this
    # device decrypts only with its own Ed25519 identity
    # (age_backup::device_identity) and uses RSA solely to encrypt TO a
    # user-supplied ssh-rsa public key, which is not the vulnerable operation.
    "RUSTSEC-2023-0071",
    # im / bitmaps / sized-chunks unmaintained (no vulnerability) - transitive
    # via penumbra-sdk-dex v2.0.4; they leave with the penumbra stack.
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0248",
    "RUSTSEC-2026-0251",
    # h2 0.3 / rustls 0.21 network-client advisories - only in generate_message,
    # the host-side Substrate metadata tool (NOT shipped in the APK; it runs on
    # a developer machine against a configured RPC node). Fixes need h2 0.4 /
    # rustls 0.23, which its jsonrpsee pin cannot take. Goes away when the
    # Substrate tooling is deleted.
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    # webpki-roots / rustls-webpki 0.101 distrusted-intermediate advisories -
    # same host-side path as above (jsonrpsee 0.16 via generate_message and the
    # subxt dev-dependency); never in the APK.
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",
    # basic-toml unmaintained (no vulnerability) - read at compile time by the
    # i18n-embed-fl proc macro behind age; nothing on the device parses TOML.
    "RUSTSEC-2026-0374",
    # crypto-bigint 0.5 timing variability - via k256 0.13 (bip32 0.5, used by
    # penumbra-sdk-keys and the cosmos path). The fix is in 0.7, which needs the
    # k256 0.14 stack those crates cannot take yet. Signing runs on an offline
    # phone, with no remote observer able to time it.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = []
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = [
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = [""]
gitlab = [""]
bitbucket = [""]
