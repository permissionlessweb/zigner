[package]
name = "module_host"
version = "0.1.0"
edition = "2021"
description = "zigner kernel side: wasmi runtime + host API for protocol modules"
license = "MIT"

[dependencies]
# Delta module updates. Pure Rust on purpose: a C toolchain dependency here
# would have to cross-compile under the NDK (zstd-sys does not, without
# hand-set CC_*) and would also complicate an F-Droid build-from-source.
bsdiff = "0.2"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
wasmi = "0.38"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# Compressing test fixtures only - never built into the app, so the C
# dependency does not reach the NDK or F-Droid build.
zstd = "0.14"
wat = "1"
